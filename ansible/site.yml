---
- name: Expand disk space on LVM
  hosts: lvm_hosts
  become: true
  tasks:
    - name: Create the practice volume group
      ansible.builtin.include_role:
        name: lvm_demo
      when: lvm_demo_enabled | bool

    - name: Add the new disks and grow the logical volume
      ansible.builtin.include_role:
        name: lvm_expand
