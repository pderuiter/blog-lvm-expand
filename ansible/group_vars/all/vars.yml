---
# The VM from terraform/ has three disks: sda (OS), sdb and sdc (empty).
# lvm_demo builds a volume group "data-vg" on sdb with a 1 GiB ext4 LV mounted on /data,
# so there is something to extend. On your own machine set lvm_demo_enabled: false
# and point the lvm_expand_* variables at your VG (e.g. ubuntu-vg / lv_var as in the post).
lvm_demo_enabled: true
lvm_demo_vg: data-vg
lvm_demo_pvs:
  - /dev/sdb
lvm_demo_lv: lv_data
lvm_demo_lv_size: 1g
lvm_demo_mount: /data

lvm_expand_vg: "{{ lvm_demo_vg }}"
lvm_expand_disks:
  - /dev/sdc
lvm_expand_wipe: false
lvm_expand_lv: "{{ lvm_demo_lv }}"
lvm_expand_lv_size: "+100%FREE"
